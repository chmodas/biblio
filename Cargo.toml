[package]
name = "biblio"
version = "0.1.0"
edition = "2024"
authors = ["Borislav Borisov <chmodas@astutebits.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/chmodas/biblio"
homepage = "https://github.com/chmodas/biblio"
readme = "README.md"
description = "Parse and serialize bibliographic records across RIS, NBIB, EndNote XML, BibTeX/BibLaTeX and CSV formats."
categories = ["parsing"]
keywords = ["bibliography", "text-processing", "science"]
rust-version = "1.85.0"

exclude = [
  ".gitignore",
  ".github",
  "README.md"
]

[lints.clippy]
pedantic = "warn"

[dependencies]
biblatex = "0.11"
csv = "1.4"
encoding_rs = "0.8"
quick-xml = "0.39"
serde = { version = "1.0.229", features = ["derive"], optional = true }
winnow = "1"

[features]
# Serialize and Deserialize for records, diagnostics, errors and CSV layouts.
serde = ["dep:serde"]

[dev-dependencies]
proptest = "1"
serde_json = "1"
test-strategy = "0.4"

[[test]]
name = "serde"
path = "tests/serde.rs"
required-features = ["serde"]

[package.metadata.docs.rs]
all-features = true
