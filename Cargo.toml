[package]
name = "biblio"
version = "0.1.0"
edition = "2024"
authors = ["Borislav Borisov <chmodas@astutebits.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/chmodas/biblio"
homepage = "https://github.com/chmodas/biblio"
readme = "README.md"
description = "Parse and serialize bibliographic records across RIS, NBIB, EndNote XML, and BibTeX/BibLaTeX formats."
categories = ["parsing"]
keywords = ["bibliography", "text-processing", "science"]
rust-version = "1.85.0"

exclude = [
  ".gitignore",
  ".github",
  "README.md"
]

[lints.clippy]
pedantic = "warn"

[dependencies]
biblatex = "0.11"
quick-xml = "0.39"
winnow = "1"

[dev-dependencies]
proptest = "1"
